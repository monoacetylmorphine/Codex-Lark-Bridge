name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    # 目标是 Apple Silicon 上的 Linux 容器，使用原生 arm64 runner。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        service: [codex_bridge, mcp_service]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Resolve newest compatible Python dependencies
        working-directory: ${{ matrix.service }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv lock --locked --python 3.13
          else
            uv lock --upgrade --python 3.13
          fi
      - name: Check deployment logic
        if: matrix.service == 'codex_bridge'
        run: uv run --no-project --python 3.13 python -B test_deploy.py -v
      - name: Build once with the resolved dependencies
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          docker build --pull --build-arg UV_SYNC_FLAGS=--locked \
            --build-arg SOURCE_REVISION="$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -f "$SERVICE/Dockerfile" -t "codex_bridge-ci:$SERVICE" .
      - name: Test the built runtime
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          if [ "$SERVICE" = codex_bridge ]; then
            entry=tests/run_tests.py
          else
            entry=tests/test_runtime.py
          fi
          docker run --rm --network none --entrypoint python \
            -v "$GITHUB_WORKSPACE/codex_bridge:/checkout/codex_bridge:ro" \
            -v "$GITHUB_WORKSPACE/mcp_service:/checkout/mcp_service:ro" -w "/checkout/$SERVICE" \
            "codex_bridge-ci:$SERVICE" -B "$entry"
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          # 使用 ${GITHUB_REPOSITORY,,} 将包含大写的仓库名转为全小写
          image="ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE:${{ github.sha }}"
          docker tag "codex_bridge-ci:$SERVICE" "$image"
          docker push "$image"
      - uses: actions/upload-artifact@v7
        with:
          name: dependencies-${{ matrix.service }}
          overwrite: true
          path: ${{ matrix.service }}/uv.lock
          if-no-files-found: error
          retention-days: 1
