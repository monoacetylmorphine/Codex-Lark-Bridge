name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # 每周重新解析兼容依赖；只发布镜像，不自动部署生产。
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Validate release version
        id: version
        run: |
          set -euo pipefail
          # 版本号来自 Git tag; 本项目仅接受不含前导零的 vMAJOR.MINOR.PATCH。
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo '版本标签必须采用 vMAJOR.MINOR.PATCH 格式，例如 v1.0.0' >&2
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            # Docker tag 的长度上限为 128 个字符。
            if (( ${#version} > 128 )); then
              echo '镜像版本标签不能超过 128 个字符' >&2
              exit 1
            fi
            printf 'tag=%s\n' "$version" >> "$GITHUB_OUTPUT"
          fi
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [version, checks]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [bridge, mcp_service]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image-${{ matrix.service }}
      - name: Push the tested image without rebuilding
        env:
          SERVICE: ${{ matrix.service }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          docker load -i "$SERVICE.tar"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}/$SERVICE"
          tag="$repository:sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "bridge-ci:$SERVICE" "$tag"
          docker push "$tag"
          if [ -n "$VERSION_TAG" ]; then
            docker tag "bridge-ci:$SERVICE" "$repository:$VERSION_TAG"
            docker push "$repository:$VERSION_TAG"
            # 仅正式版本发布更新 latest, 复用同一个通过测试的镜像。
            docker tag "bridge-ci:$SERVICE" "$repository:latest"
            docker push "$repository:latest"
            printf 'Image Version: `%s:%s`\n' "$repository" "$VERSION_TAG" >> "$GITHUB_STEP_SUMMARY"
            printf 'Image Latest: `%s:latest`\n' "$repository" >> "$GITHUB_STEP_SUMMARY"
          fi
          digest=$(docker inspect "$tag" | jq -er --arg prefix "$repository@sha256:" \
            'first(.[0].RepoDigests[] | select(startswith($prefix)))')
          jq -n --arg image "$digest" '{image: $image}' > "$SERVICE.json"
          docker logout ghcr.io
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}
          overwrite: true
          path: ${{ matrix.service }}.json
          if-no-files-found: error
  bundle:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Record the release
        run: |
          jq -n --arg revision "$GITHUB_SHA" --arg run_id "$GITHUB_RUN_ID" \
            --slurpfile codex digests/bridge.json --slurpfile mcp_service digests/mcp_service.json \
            '{revision: $revision, run_id: $run_id, platform: "linux/arm64",
              images: {"bridge": $codex[0].image, "mcp_service": $mcp_service[0].image}}' > release.json
          cat release.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release
          overwrite: true
          path: |
            release.json
            compose.production.yaml
            deploy.sh
          if-no-files-found: error
