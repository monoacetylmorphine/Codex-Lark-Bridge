# Model
model = "gemma4:26b-mlx"
model_provider = "local-ollama"
model_reasoning_effort = "low"

forced_login_method = "api"
model_context_window = 32768
model_auto_compact_token_limit = 25600
model_auto_compact_token_limit_scope = "total"
tool_output_token_limit = 5120

sandbox_mode = "workspace-write"
approval_policy = "never"
allow_login_shell = true


notify = ["/Users/fersk/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient", "turn-ended"]

[model_providers.local-ollama]
name = "LocalOllama"
base_url = "http://host.docker.internal:11434/v1"
wire_api = "responses"


requires_openai_auth = false
request_max_retries = 1
stream_max_retries = 2
stream_idle_timeout_ms = 300000


[sandbox_workspace_write]
network_access = true


# MCP
[mcp_servers.fersk-mcp]
url = "http://fersk-mcp:8000/mcp"
enabled = true
required = true
startup_timeout_ms = 10000
tool_timeout_sec = 120
supports_parallel_tool_calls = true

[mcp_servers.node_repl]
args = []
command = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/Users/fersk/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
CODEX_HOME = "/Users/fersk/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.911.61220"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/Users/fersk/.codex/plugins/cache/openai-bundled/browser/26.911.61220/scripts/browser-service.mjs","sky":"@oai/sky/service"}'
SKY_CUA_SERVICE_PATH = "/Users/fersk/.codex/computer-use/Codex Computer Use.app"
CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"

[mcp_servers.computer-use]
command = "./Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient"
args = ["mcp"]
cwd = "."
enabled = false


# Memory
[memories]
generate_memories = true
use_memories = true

min_rollout_idle_hours = 24
max_rollout_age_days = 30
max_unused_days = 90
max_rollouts_per_startup = 16
max_raw_memories_for_consolidation = 256
disable_on_external_context = true


# History
[history]
persistence = "save-all"
max_bytes = 104857600

[projects."/home/fersk"]
trust_level = "trusted"

[projects."/home/fersk/fersk"]
trust_level = "trusted"

[projects."/Users/fersk/Documents/Codex/2026-09-17/he"]
trust_level = "trusted"

[projects."/home/app/.codex/workspace/on_d6ce39b714886434cb949513c17aa8aa"]
trust_level = "trusted"

[desktop]
followUpQueueMode = "steer"

[marketplaces.openai-bundled]
source_type = "local"
source = "/Users/fersk/.codex/.tmp/bundled-marketplaces/openai-bundled"

[plugins."browser@openai-bundled"]
enabled = true

[plugins."unified-computer-use@openai-bundled"]
enabled = true

[plugins."computer-use@openai-bundled"]
enabled = true

[plugins."visualize@openai-bundled"]
enabled = true
