model = "gpt-6-sol"
model_provider = "soulecho"
forced_login_method = "api"
model_reasoning_effort = "high"
web_search = "disabled"
show_raw_agent_reasoning = true
model_catalog_json = "~/.codex/models.json"
tool_output_token_limit = 50000

sandbox_mode = "workspace-write"
approval_policy = "never"
allow_login_shell = true

[model_providers.soulecho]
name = "soulecho"
base_url = "https://ai.soulecho.cc/v1"
wire_api = "responses"
env_key = "OPENAI_API_KEY"


[desktop]
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]


[sandbox_workspace_write]
network_access = true


# MCP
[mcp_servers.bridge-mcp-server]
url = "http://mcp_service:8000/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 120
supports_parallel_tool_calls = true
default_tools_approval_mode = "approve"


# Memory
[memories]
generate_memories = true
use_memories = true
extract_model = "deepseek-flash"
consolidation_model = "deepseek-flash"
min_rollout_idle_hours = 24
max_rollout_age_days = 30
max_unused_days = 90
max_rollouts_per_startup = 16
max_raw_memories_for_consolidation = 256
disable_on_external_context = true


# History
[history]
persistence = "save-all"
max_bytes = 104857600

[marketplaces.codex-observability-plugin]
source_type = "git"
source = "https://github.com/langfuse/codex-observability-plugin.git"

[features]
plugin_hooks = true

[plugins."tracing@codex-observability-plugin"]
enabled = true

[hooks.state]

[hooks.state."tracing@codex-observability-plugin:hooks/hooks.json:stop:0:0"]
enabled = true
trusted_hash = "sha256:69a05cbfa6984ec5f1433343b45480d5239c119e7332ae863f9865edc2efec74"

[tui]
screen_reader_detection_done = true


[shell_environment_policy]
inherit = "all"

