# =============================================================================
# Hermes Agent 配置
# =============================================================================

_config_version: 46

# ── 数据库 ───────────────────────────────────────────────────────────────
# 当前 /opt/data 已迁移到 Docker named volume，位于 Linux VM 本地文件系统，
# WAL 安全。无需设置 database.journal_mode。
database:
  journal_mode: delete

# ── 运行时 ───────────────────────────────────────────────────────────────
runtime:
  nofile_soft_limit: 4096

# =============================================================================
# 模型
# =============================================================================
model:
  default: gpt-6-sol
  provider: custom:ai.soulecho.cc
  base_url: ''

fallback_model:
  provider: deepseek
  model: deepseek/deepseek-v4-flash

custom_providers:
  - name: Ai.soulecho.cc
    base_url: https://hk.ai.soulecho.cc/v1
    key_env: HERMES_CUSTOM_AI_SOULECHO_CC_API_KEY
    model: gpt-6-sol
    models:
      gpt-5.5: {}
      codex-auto-review: {}
      gpt-6-sol: {}
      gpt-5.6-sol: {}
      gpt-5.6-terra: {}
      gpt-6-astra: {}
      gpt-6.1-sol: {}
    api_mode: chat_completions
    models_discovered: true

prompt_caching:
  cache_ttl: 5m

# =============================================================================
# 终端工具
# =============================================================================
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 600
  lifetime_seconds: 3600
  home_mode: auto
  auto_source_bashrc: true
  # 容器后端镜像（当前后端为 local，以下仅在切换后端时生效）
  docker_image: nikolaik/python-nodejs:python3.13-nodejs26
  singularity_image: docker://nikolaik/python-nodejs:python3.13-nodejs26
  modal_image: nikolaik/python-nodejs:python3.13-nodejs26
  daytona_image: nikolaik/python-nodejs:python3.13-nodejs26
  # 容器资源
  container_cpu: 2
  container_memory: 5120      # 5 GB
  container_disk: 51200       # 50 GB
  container_persistent: false
  docker_mount_cwd_to_workspace: true
  docker_run_as_host_user: true
  quiet: true
  echo: false

# =============================================================================
# 安全
# =============================================================================
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true

approvals:
  destructive_slash_confirm: true

command_allowlist:
  - script execution via -e/-c flag

hooks_auto_accept: true

# =============================================================================
# 工具循环护栏
# =============================================================================
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
  loop_caps:
    max_subagents: 0

# =============================================================================
# 上下文压缩
# =============================================================================
compression:
  enabled: true
  progress_notices: true
  threshold: 0.5
  target_ratio: 0.2
  tail_mode: lean
  protect_last_n: 20
  protect_first_n: 5
  proactive_prune_tokens: 0
  idle_compact_after_seconds: 0
  in_place: true
  # 以下为内部卫生参数
  hygiene_hard_message_limit: 5000
  hygiene_timeout_seconds: 30

# =============================================================================
# 辅助模型（auxiliary）
# =============================================================================
auxiliary:
  vision:
    provider: custom:ai.soulecho.cc
    model: gpt-6-sol
    timeout: 180
  compression:
    provider: deepseek
    model: deepseek-v4-flash
    timeout: 180
  title_generation:
    provider: custom:ai.soulecho.cc
    model: gpt-6-sol
  profile_describer:
    provider: deepseek
    model: deepseek-v4-flash

# =============================================================================
# Agent 行为
# =============================================================================
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
  # personalities 用内置默认即可，无需重复定义；如需新增/覆盖，取消注释：
  # personalities:
  #   mentor: "You are a supportive mentor. Guide, don't lecture."

# =============================================================================
# 显示
# =============================================================================
display:
  compact: false
  busy_input_mode: steer
  bell_on_complete: true
  show_reasoning: true
  reasoning_full: false
  background_process_notifications: concise
  streaming: true
  file_mutation_verifier: true
  skin: default
  interim_assistant_messages: true
  show_commentary: false
  tool_progress: false
  terminal_merge_output: true
  tool_output_inline: false
  cleanup_progress: true
  long_running_notifications: true
  busy_ack_detail: true
  tui_theme: light

dashboard:
  theme: default
  font: theme

# =============================================================================
# 语音转写（STT）
# =============================================================================
stt:
  enabled: true
  provider: local
  language: zh
  echo_transcripts: false
  local:
    model: base
    language: zh

# =============================================================================
# 持久记忆
# =============================================================================
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: false
  memory_char_limit: 5000
  user_char_limit: 5000

# =============================================================================
# 技能
# =============================================================================
skills:
  inline_shell: true
  inline_shell_timeout: 300
  guard_agent_created: true
  creation_nudge_interval: 15
  disabled:
    - agent-browser
    - apple-notes
    - apple-reminders
    - audiocraft-audio-generation
    - box
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - comfyui
    - email-inbox-triage
    - evaluating-llms-harness
    - findmy
    - get-xiaohongshu-notes
    - gif-search
    - github-auth
    - github-code-review
    - github-issue-to-pr
    - github-issues
    - github-pr-workflow
    - github-repo-management
    - google-workspace
    - heartmula
    - himalaya
    - huggingface-hub
    - iMessage
    - jupyter-live-kernel
    - llama-cpp
    - opencode
    - openhue
    - segment-anything-model
    - self-improving-agent
    - serving-llms-vllm
    - songsee
    - weights-and-biases
    - xiaohongshu-note-create-guide
    - xurl
    - youtube-content
    - yuanbao

# =============================================================================
# 代码执行沙箱
# =============================================================================
code_execution:
  timeout: 600
  max_tool_calls: 10

# =============================================================================
# 会话
# =============================================================================
max_concurrent_sessions: 8
group_sessions_per_user: true

session_reset:
  mode: daily          # 必填，设置为 "daily" 即可启用每日重置
  at_hour: 4           # 选填，重置时间（24小时制），默认凌晨 4 点
  idle_minutes: 1440   # 选填，闲置超时时间（分钟），默认 1440 分钟（24小时）
  notify: true         # 选填，重置时是否通知用户，默认 true

# =============================================================================
# MoA（Mixture of Agents）
# =============================================================================
moa:
  enabled: false

# =============================================================================
# 流式输出
# =============================================================================
streaming:
  enabled: true

# =============================================================================
# 时区
# =============================================================================
timezone: Asia/Shanghai

# =============================================================================
# 更新
# =============================================================================
updates:
  pre_update_backup: true
  backup_keep: 5
  non_interactive_local_changes: stash

# =============================================================================
# Web 工具
# =============================================================================
web:
  backend: tavily
  use_gateway: false

# =============================================================================
# 检查点
# =============================================================================
checkpoints:
  enabled: true
  max_snapshots: 10

# =============================================================================
# 工具输出大小限制
# =============================================================================
context_file_max_chars: 1800000
file_read_max_chars: 1000000
tool_output:
  max_bytes: 300000
  max_lines: 8000
  max_line_length: 5000

# =============================================================================
# 平台工具集
# =============================================================================
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - video
    - vision

    - web
platforms:
  feishu:
    enabled: true

# =============================================================================
# 插件
# =============================================================================
plugins:
  enabled:
    - model-providers/deepseek
    - observability/langfuse
    - platforms/feishu
    - web/tavily
  disabled: []

# =============================================================================
# 引导状态（Hermes 自动维护，不必手改）
# =============================================================================
onboarding:
  seen:
    openclaw_residue_cleanup: true
    busy_input_prompt: true
    profile_build_offered: true

known_plugin_toolsets:
  cli:
    - a2a
    - spotify

known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
