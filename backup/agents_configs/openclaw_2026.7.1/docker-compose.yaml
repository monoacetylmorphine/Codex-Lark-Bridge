services:
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:2026.7.1
    container_name: openclaw-gateway
    restart: unless-stopped
    environment:
      OPENCLAW_GATEWAY_TOKEN: 59736ac9cdc7a717948d5bcfb5e814a2bbc2955fe6f70c49
      OPENCLAW_GATEWAY_MODE: local 
      TZ: Asia/Shanghai
    env_file:
      - ~/.openclaw/.env
    volumes:
      - ~/.openclaw:/home/node/.openclaw
    ports:
      - "127.0.0.1:18789:18789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "lan",
        "--port",
        "18789",
        # "--allow-unconfigured",
      ]
    networks:
      - ai-infra

