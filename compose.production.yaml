# 参数来源：生产主机 host.json，由 deploy.sh 校验后通过环境传入。
# 使用独立项目名；首次接管前先停止旧项目的两个应用，基础设施继续运行。
# 健康检查的 interval/timeout/retries/start_period 来源：本项目单机部署的初始探测预算。
services:
  codex_bridge:
    image: ${CODEX_IMAGE:?必须提供 CODEX_IMAGE}
    platform: linux/arm64
    init: true
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    # 来源：为既有任务中断、卡片收尾和 SDK 退出预留 60 秒。
    stop_grace_period: 60s
    environment:
      HOME: /home/app
      CODEX_HOME: /home/app/.codex
      CONFIG_FILE: /home/app/.codex_bridge/config.json
    volumes: &app-volumes
      - type: bind
        source: ${HOST_CODEX_DIR:?必须提供 HOST_CODEX_DIR}
        target: /home/app/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_DIR:?必须提供 HOST_DIR}
        target: /home/app/.codex_bridge
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -m, codex_bridge.utils.health]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [ai-infra]
  mcp_service:
    image: ${MCP_IMAGE:?必须提供 MCP_IMAGE}
    platform: linux/arm64
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      HOME: /home/app
      CODEX_HOME: /home/app/.codex
      CONFIG_FILE: /home/app/.codex_bridge/config.json
      MCP_HOST: 0.0.0.0
      MCP_PORT: '8000'
    ports:
      - '127.0.0.1:${MCP_PORT:?必须提供 MCP_PORT}:8000'
    volumes: *app-volumes
    healthcheck:
      test: [CMD, python, -m, mcp_service.utils.health]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks: [ai-infra]
networks:
  ai-infra:
    external: true
    name: ai-infra
