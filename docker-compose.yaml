services:
  codex_bridge:
    image: ghcr.io/monoacetylmorphine/codex-lark-bridge/codex_bridge:latest
    platform: linux/arm64
    user: "${APP_UID:-1000}:1000"
    security_opt:
      - seccomp=unconfined
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      HOME: /home/${APP_USER:-app}
      CODEX_HOME: /home/${APP_USER:-app}/.codex
      XDG_CACHE_HOME: /home/${APP_USER:-app}/.codex_bridge/.cache
      XDG_DATA_HOME: /home/${APP_USER:-app}/.codex_bridge/.local/share
    networks:
      - ai-infra
    volumes:
      - type: bind
        source: ${HOST_CODEX_DIR:-${HOME}/.codex}
        target: /home/${APP_USER:-app}/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_DIR:-${HOME}/.codex_bridge}
        target: /home/${APP_USER:-app}/.codex_bridge
        bind:
          create_host_path: false

  mcp_service:
    image: ghcr.io/monoacetylmorphine/codex-lark-bridge/mcp_service:latest
    platform: linux/arm64
    user: "${APP_UID:-1000}:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      HOME: /home/${APP_USER:-app}
      CODEX_HOME: /home/${APP_USER:-app}/.codex
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8000}
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    networks:
      - ai-infra
    volumes:
      - type: bind
        source: ${HOST_CODEX_DIR:-${HOME}/.codex}
        target: /home/${APP_USER:-app}/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_DIR:-${HOME}/.codex_bridge}
        target: /home/${APP_USER:-app}/.codex_bridge
        bind:
          create_host_path: false


  # Langfuse Worker

  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:latest
    container_name: langfuse-worker
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    environment:
      <<: &langfuse-environment
        NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
        # 默认连接本 Compose 的 PostgreSQL；特殊字符凭据可通过编码后的 DATABASE_URL 覆盖。
        DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}}
        SALT: ${SALT:?必须设置 SALT}
        ENCRYPTION_KEY: ${ENCRYPTION_KEY:?必须设置 ENCRYPTION_KEY}
        TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
        CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL:-clickhouse://clickhouse:9000}
        CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
        CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
        CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?必须设置 CLICKHOUSE_PASSWORD}
        CLICKHOUSE_CLUSTER_ENABLED: false
        # 仅配置事件存储，凭据与本 Compose 的 MinIO 共用同一来源。
        LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${LANGFUSE_S3_EVENT_UPLOAD_BUCKET:-langfuse}
        LANGFUSE_S3_EVENT_UPLOAD_REGION: ${LANGFUSE_S3_EVENT_UPLOAD_REGION:-auto}
        LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
        LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}
        LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: ${LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT:-http://minio:9000}
        LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: ${LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE:-true}
        LANGFUSE_S3_EVENT_UPLOAD_PREFIX: ${LANGFUSE_S3_EVENT_UPLOAD_PREFIX:-events/}
        REDIS_HOST: ${REDIS_HOST:-redis}
        REDIS_PORT: ${REDIS_PORT:-6379}
        REDIS_AUTH: ${REDIS_AUTH:?必须设置 REDIS_AUTH}
      LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK: ${LANGFUSE_BULLMQ_SKIP_REDIS_VERSION_CHECK:-false}

    networks:
      - ai-infra


  # Langfuse Web

  langfuse-web:
    image: docker.io/langfuse/langfuse:latest
    container_name: langfuse-web
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    ports:
      - 127.0.0.1:3000:3000

    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?必须设置 NEXTAUTH_SECRET}
      LANGFUSE_ENABLE_PROMETHEUS: true

    networks:
      - ai-infra


  # PostgreSQL

  postgres:
    image: docker.io/postgres:latest
    container_name: langfuse-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      TZ: UTC
      PGTZ: UTC

    volumes:
      - langfuse_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10

    networks:
      - ai-infra


  # ClickHouse

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:latest
    container_name: langfuse-clickhouse
    restart: unless-stopped

    user: "101:101"

    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?必须设置 CLICKHOUSE_PASSWORD}

    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server

    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

    networks:
      - ai-infra


  # MinIO

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: langfuse-minio
    restart: unless-stopped

    entrypoint: sh

    command:
      - -c
      - |
        mkdir -p /data/langfuse
        minio server --address ":9000" --console-address ":9001" /data

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?必须设置 MINIO_ROOT_PASSWORD}

    volumes:
      - langfuse_minio_data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

    networks:
      - ai-infra


  # Redis

  redis:
    image: docker.io/redis:latest
    container_name: langfuse-redis
    restart: unless-stopped

    command:
      - redis-server
      - --requirepass
      - ${REDIS_AUTH:?必须设置 REDIS_AUTH}
      - --maxmemory-policy
      - noeviction

    volumes:
      - langfuse_redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH:?必须设置 REDIS_AUTH}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

    networks:
      - ai-infra

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:

networks:
  ai-infra:
    external: true
    name: ai-infra
